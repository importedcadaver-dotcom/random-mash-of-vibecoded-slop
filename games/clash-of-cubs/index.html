<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e2b26">
  <title>Clash of Cubs — Mosswood Valley</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand"><div class="brandmark">🐻</div><div><strong>CLASH OF CUBS</strong><small>MOSSWOOD VALLEY</small></div></div>
      <section class="season"><div class="micro">SEASON 01</div><b>Honeyfall Harvest</b><span>Day <i id="dayrail">1</i> · Your den is growing</span></section>
      <nav class="nav" aria-label="Main menu">
        <button data-page="den" class="active"><i>⌂</i><span>Den</span></button>
        <button data-page="build"><i>▦</i><span>Build</span></button>
        <button data-page="train"><i>✦</i><span>Train cubs</span></button>
        <button data-page="raidMap"><i>⚔</i><span>Raid map</span></button>
        <button data-page="collection"><i>♡</i><span>Bear book</span></button>
      </nav>
      <div class="railnote"><b>Make a little noise.</b><br>Every cub has a brave day in them. Some just need a nap first.</div>
    </aside>
    <main class="main">
      <header class="top"><div class="crumb">MOSSWOOD VALLEY <span>›</span> <b id="crumb">Your den</b></div><div class="resources" id="resources"></div></header>
      <div id="view" class="content"></div>
    </main>
  </div>
  <div id="modalroot" class="modalroot"></div>
  <div id="toastroot"></div>
  <script src="game.js"></script>
</body>
</html>
