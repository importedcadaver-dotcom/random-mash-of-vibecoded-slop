ound:#f4f1e8;border:1px solid var(--line);border-radius:10px;padding:11px 9px;text-align:center;cursor:pointer}.cub .face{font-size:25px}.cub b{display:block;font-size:11px}.cub small{color:var(--muted);font:9px 'DM Mono',monospace}.cub .count{font-weight:900;color:var(--moss);font-size:11px;margin-top:5px}.log{padding:14px 17px;max-height:210px;overflow:auto}.log h2{font-size:13px;margin:0 0 9px}.logline{border-left:2px solid #d5b66d;padding:3px 0 4px 9px;margin:8px 0;font-size:11px;line-height:1.35;color:#59665e}.logline time{font:9px 'DM Mono',monospace;color:#a49a84;display:block;margin-bottom:2px}.sectiongrid{grid-template-columns:repeat(2,minmax(0,1fr))}.buildcard{padding:16px}.buildtop{display:flex;gap:11px;align-items:center}.buildicon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#e5ecdb;font-size:23px}.buildtop h3{margin:0;font-size:13px}.buildtop small{color:var(--muted);font-size:10px}.buildcard p{min-height:35px;color:var(--muted);font-size:11px;line-height:1.4}.buildfoot{display:flex;justify-content:space-between;align-items:center}.cost{font:9px 'DM Mono',monospace;color:#736f62}.unitcards{grid-template-columns:repeat(5,minmax(0,1fr))}.unitcard{padding:15px;text-align:center}.unitcard .face{font-size:34px}.unitcard h3{font-size:12px;margin:5px 0}.unitcard p{height:39px;font-size:10px;color:var(--muted);line-height:1.35}.unitcard .cost{margin:0 0 10px;line-height:1.6}.raidlayout{grid-template-columns:1.55fr .75fr}.mapbg{position:relative;min-height:460px;background:linear-gradient(145deg,#dfd4bb,#ccb794);padding:22px;border-radius:0 0 14px 14px;overflow:hidden}.enemy{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:18px auto}.target{min-height:105px;border:2px solid #fcf5e8;border-radius:13px;background:#eee4d1cc;display:grid;align-content:center;justify-items:center;cursor:pointer;position:relative;box-shadow:0 4px 0 #aa9876}.target:hover,.target.chosen{outline:3px solid var(--gold);transform:translateY(-2px)}.target .emoji{font-size:35px}.target b{font-size:11px}.target small{font:9px 'DM Mono',monospace;color:#7b7363}.hp{position:absolute;bottom:8px;left:12%;width:76%;height:5px;background:#d1c7b5;border-radius:9px}.hp i{height:100%;display:block;background:#b46b63;border-radius:9px}.guard{position:absolute;font-size:15px;right:7px;top:4px}.target.destroyed{opacity:.35;filter:grayscale(1);pointer-events:none;box-shadow:none}.deploypanel{padding:16px}.deploypanel h2{font-size:14px;margin:0 0 3px}.deploypanel>p{font-size:11px;color:var(--muted);line-height:1.4}.pick{display:grid;gap:7px;margin:13px 0}.pick button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;background:#fffdf7;padding:8px;text-align:left;cursor:pointer;font:700 10px Nunito}.pick button.selected{border-color:#668b64;background:#ebf1e5}.pick .face{font-size:22px}.pick small{display:block;color:var(--muted);font-size:9px}.deploypanel .btn{width:100%}.speech{margin:12px 0;padding:12px;border-radius:11px;background:#f4ecd9;border:1px solid #e7d9bb;font-size:11px;line-height:1.5}.speech b{color:#92672c}.battlelog{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;max-height:158px;overflow:auto}.battlelog div{font-size:10px;color:#657066;margin:7px 0;line-height:1.35}.defend{padding:17px}.defend p{color:var(--muted);font-size:12px;line-height:1.5}.overlay{position:fixed;inset:0;z-index:10;background:#18231dcc;display:grid;place-items:center;padding:20px}.modal{width:min(470px,100%);border-radius:18px;background:#fffaf0;padding:27px;box-shadow:0 25px 90px #0005;text-align:center}.modal .hero{font-size:54px}.modal h2{font-size:23px;margin:7px}.modal p{font-size:13px;line-height:1.6;color:#66736a}.modal .btn{margin-top:10px}.toast{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);background:#22342c;color:white;border-radius:10px;padding:12px 17px;font-size:12px;box-shadow:var(--shadow);animation:up .2s ease}@keyframes up{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}.footnote{margin-top:18px;text-align:center;font:9px 'DM Mono',monospace;color:#9a9b8e}.hidden{display:none!important}
@media(max-width:940px){.app{grid-template-columns:74px 1fr}.rail{padding:20px 9px;align-items:center}.brand{padding:0}.brand>div:last-child,.season,.nav span,.railfoot{display:none}.nav button{width:48px;text-align:center;padding:12px 0}.nav i{margin:0}.top{padding:0 17px}.content{padding:23px 17px}.topgrid{grid-template-columns:1fr}.sidecol{grid-template-columns:1fr 1fr}.raidlayout{grid-template-columns:1fr}.unitcards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.app{grid-template-columns:1fr;grid-template-rows:58px auto}.rail{grid-row:1;flex-direction:row;padding:8px 13px;justify-content:space-between}.brandmark{width:35px;height:35px}.brand strong{font-size:12px}.brand small{font-size:8px}.brand>div:last-child{display:block}.nav{display:flex;gap:2px}.nav button{width:38px;padding:9px 0}.top{height:auto;min-height:66px;padding:9px 12px;gap:8px;align-items:flex-start;flex-direction:column}.resources{width:100%;justify-content:space-between}.resource{min-width:0;padding:6px 7px;font-size:9px;gap:4px}.resource span{font-size:12px}.content{padding:19px 12px}.pagehead h1{font-size:25px}.sidecol{grid-template-columns:1fr}.denmap{height:255px}.plot{width:78px;height:65px}.p1{left:4%}.p2{left:40%}.p3{right:3%}.p4{left:15%}.p5{left:53%}.unitcards,.sectiongrid{grid-template-columns:repeat(2,minmax(0,1fr))}.enemy{gap:8px}.target{min-height:94px}.mapbg{padding:13px;min-height:420px}.pagehead{align-items:flex-start;gap:10px;flex-direction:column}}

<body><div class="app"><aside class="rail"><div class="brand"><div class="brandmark">🐻</div><div><strong>CLASH OF CUBS</strong><small>MOSSWOOD VALLEY</small></div></div><div class="season"><small>SEASON 01</small><b>Honeyfall Harvest</b><span>Day <i id="dayrail">1</i> · The first raid</span></div><nav class="nav"><button data-page="den" class="active"><i>⌂</i><span>Den</span></button><button data-page="train"><i>✦</i><span>Train cubs</span></button><button data-page="raid"><i>⚔</i><span>Raid map</span></button><button data-page="collection"><i>♡</i><span>Collection</span></button></nav><div class="railfoot"><b>Make a little noise.</b><br>Every cub has a brave day in them. Some just need a nap first.</div></aside><main class="main"><header class="top"><div class="crumb">MOSSWOOD VALLEY <span>›</span> <b id="crumb">Your den</b></div><div class="resources" id="resources"></div></header><div id="view" class="content"></div></main></div><div id="modalroot"></div><div id="toastroot"></div>
<script>
(()=>{'use strict';
const names={honey:'Honey',berries:'Berries',fish:'Fish',toys:'Toys',wood:'Timber'};
const icons={honey:'🍯',berries:'🫐',fish:'🐟',toys:'🧸',wood:'🪵'};
const units={roller:{name:'Roller cub',emoji:'🛞',type:'⚡',desc:'Smashes walls. Big tumbling energy.',cost:{honey:18,berries:4},hp:40,damage:27,line:'Wall first! I brought my whole self.'},climber:{name:'Climber cub',emoji:'🧗',type:'↗',desc:'Hops over walls to reach stores.',cost:{honey:15,berries:8},hp:30,damage:19,line:'Look up! I found the shortcut!'},screecher:{name:'Screecher cub',emoji:'📣',type:'♫',desc:'Stuns a guard with a mighty holler.',cost:{honey:16,fish:8},hp:32,damage:16,line:'Eeeee! That was my outside voice!'},tunnel:{name:'Tunnel cub',emoji:'⛏️',type:'⌁',desc:'Burrows under walls to surprise foes.',cost:{honey:21,wood:8},hp:36,damage:22,line:'I made a surprise door!'},sleepy:{name:'Sleepy cub',emoji:'😴',type:'☾',desc:'Dozes off; wake for a giant bonk.',cost:{honey:12,fish:8},hp:34,damage:10,line:'Five more minutes... wait, BONK!'}};
const buildings={nursery:{name:'Nursery',emoji:'🛖',desc:'A cozy place for more cubs. Each upgrade helps train faster.',cost:{wood:32,honey:24},benefit:'+1 cub slot'},store:{name:'Honey pantry',emoji:'🍯',desc:'Keep a little extra honey tucked out of paw reach.',cost:{wood:24,berries:20},benefit:'+40 protected honey'},wall:{name:'Log wall',emoji:'🪵',desc:'A sturdy ring to slow down snoopy raiders.',cost:{wood:28,honey:10},benefit:'Stronger stash defense'},berry:{name:'Berry patch',emoji:'🫐',desc:'A cheerful patch of snacks by the sunny rock.',cost:{wood:14,berries:10},benefit:'Daily berry basket'}};
const defaults=()=>({day:1,res:{honey:120,berries:84,fish:65,toys:36,wood:115},build:{nursery:1,store:1,wall:0,berry:0},roster:{roller:1,climber:1,screecher:0,tunnel:0,sleepy:1},wins:0,raidCount:0,casualties:0,log:[],seen:false,collection:['roller','climber','sleepy'],lastRaid:null});
let saved;try{saved=JSON.parse(localStorage.getItem('clash-cubs-save'))}catch{}let s={...defaults(),...(saved||{})};s.res={...defaults().res,...(s.res||{})};s.build={...defaults().build,...(s.build||{})};s.roster={...defaults().roster,...(s.roster||{})};let page='den',raid=null,selectedUnit=null,selectedTarget=null;
const save=()=>localStorage.setItem('clash-cubs-save',JSON.stringify(s));
const esc=x=>String(x).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function log(t){s.log.unshift({day:s.day,text:t});s.log=s.log.slice(0,18);save()}
function toast(t){let root=document.querySelector('#toastroot');root.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>root.innerHTML='',2100)}
function pay(cost){for(let k in cost)if((s.res[k]||0)<cost[k])return false;for(let k in cost)s.res[k]-=cost[k];return true}
function costText(cost){return Object.entries(cost).map(([k,v])=>`${icons[k]} ${v}`).join(' · ')}
function resourceBar(){document.querySelector('#resources').innerHTML=Object.entries(icons).map(([k,e])=>`<div class="resource"><span>${e}</span><b>${s.res[k]}</b></div>`).join('');document.querySelector('#dayrail').textContent=s.day}
function setPage(p){page=p;selectedUnit=null;selectedTarget=null;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>b.dataset.page==='raid'&&!raid?startRaid():setPage(b.dataset.page));
function render(){resourceBar();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let labels={den:'Your den',train:'Cub nursery',raid:'Raid map',collection:'Cub collection'};document.querySelector('#crumb').textContent=labels[page];let v=document.querySelector('#view');if(page==='den')v.innerHTML=denPage();if(page==='train')v.innerHTML=trainPage();if(page==='collection')v.innerHTML=collectionPage();if(page==='raid')v.innerHTML=raidPage();wire();if(!s.seen){s.seen=true;save();welcome()}}
function plot(key,label,level,emoji,cls){return `<button class="plot ${cls}" data-build="${key}"><span><span class="emoji">${emoji}</span><b>${label}</b><small>LEVEL ${level}</small></span></button>`}
function denPage(){let next=raid?`<div class="label">Rival scout report</div><h3>Maple-Moon Outpost</h3><p>Their guards are watching the pantry. A climber might take the high path. A screecher can give your friends a moment to dash through.</p><button class="btn primary" data-act="go-raid">${s.lastRaid?'SCOUT THE OUTPOST AGAIN':'PLAN YOUR FIRST RAID'}　→</button>`:`<div class="label">Today's little adventure</div><h3>Maple-Moon Outpost</h3><p>A neighboring family has a few spare supplies. Can your cubs make a clever plan and come home together?</p><button class="btn primary" data-act="go-raid">SCOUT THE OUTPOST　→</button>`;
return `<div class="pagehead"><div><div class="eyebrow">DAY ${s.day} · HONEYFALL HARVEST</div><h1>Good morning, Mosswood.</h1><div class="sub">Your den is warm, your pantry is tidy, and the cubs are already plotting.</div></div><button class="btn ghost" data-act="end-day">🌙 End day</button></div><div class="grid topgrid"><div class="card"><div class="cardhead"><h2>YOUR DEN</h2><small>Tap a building to improve it</small></div><div class="denmap"><div class="path"></div><i class="tree" style="left:5%;top:5%">🌳</i><i class="tree" style="right:3%;top:57%">🌲</i><i class="tree" style="left:46%;bottom:0">🌳</i><div class="pond"></div>${plot('nursery','Nursery',s.build.nursery,'🛖','p1')}${plot('store','Honey pantry',s.build.store,'🍯','p2')}${plot('berry','Berry patch',s.build.berry,'🫐','p3')}${plot('wall','Log wall',s.build.wall,'🪵','p4')}<div class="denflag">🏡</div>${plot('train','Cub yard',Object.values(s.roster).reduce((a,b)=>a+b,0),'🐻','p5')}<div class="mapcaption">MOSSWOOD · EST. DAY 1</div></div><div class="mission"><div class="missiontop"><span class="pill">${s.wins?'A new day':'FIRST RAID'}</span><span class="label">A LITTLE EXPLORING</span></div>${next}</div></div><div class="sidecol"><section class="card daily"><div class="cardhead" style="padding:0"><h2>Den chores</h2><small>DAY ${s.day}</small></div><div class="quest"><div class="qicon">🪵</div><div><b>Gather a timber bundle</b><small>${s.res.wood>=115?'Ready for a build':'Build something to spend it'}</small><div class="bar"><i style="width:${Math.min(100,Math.round(s.res.wood/1.15))}%"></i></div></div></div><div class="quest"><div class="qicon">🐾</div><div><b>Take a cub on a raid</b><small>${s.wins?'Outpost explored '+s.wins+' time'+(s.wins===1?'':'s'):'Your first adventure awaits'}</small><div class="bar"><i style="width:${s.wins?100:0}%"></i></div></div></div></section><section class="card"><div class="cardhead"><h2>Ready cubs</h2><button class="btn ghost" data-act="go-train" style="padding:6px 9px">Train +</button></div><div class="squad"><div class="cubrow">${Object.entries(s.roster).filter(([,n])=>n>0).map(([k,n])=>`<div class="cub"><div class="face">${units[k].emoji}</div><b>${units[k].name.split(' ')[0]}</b><small>${units[k].type} specialist</small><div class="count">× ${n}</div></div>`).join('')}</div></div></section><section class="card log"><h2>Den noticeboard</h2>${s.log.length?s.log.slice(0,4).map(x=>`<div class="logline"><time>DAY ${x.day}</time>${esc(x.text)}</div>`).join(''):`<div class="logline">The kettle is on. The cubs are making a map out of toast crumbs.</div>`}</section></div></div><div class="footnote">A SMALL, OFFLINE STRATEGY PROTOTYPE · AUTOSAVES IN THIS BROWSER</div>`}
function buildCard(k){let b=buildings[k],lv=s.build[k];let cost={...b.cost};for(let x in cost)cost[x]=Math.ceil(cost[x]*(lv+1));return `<article class="card buildcard"><div class="buildtop"><div class="buildicon">${b.emoji}</div><div><h3>${b.name} · Lv ${lv}</h3><small>${b.benefit}</small></div></div><p>${b.desc}</p><div class="buildfoot"><div class="cost">${costText(cost)}</div><button class="btn primary" data-build="${k}" data-cost='${JSON.stringify(cost)}'>UPGRADE</button></div></article>`}
function trainPage(){return `<div class="pagehead"><div><div class="eyebrow">YOUR CUB NURSERY · LEVEL ${s.build.nursery}</div><h1>Pick your little specialists.</h1><div class="sub">Every cub is different. A good team has room for everyone's kind of brave.</div></div><button class="btn ghost" data-act="back-den">← Your den</button></div><div class="grid unitcards">${Object.entries(units).map(([k,u])=>`<article class="card unitcard"><div class="face">${u.emoji}</div><h3>${u.name}</h3><span class="pill">${u.type} specialist</span><p>${u.desc}</p><div class="cost">${costText(u.cost)}</div><button class="btn primary" data-train="${k}">TRAIN A CUB</button></article>`).join('')}</div><div class="card" style="margin-top:18px;padding:16px 18px"><div class="label">TEAM TIP</div><p style="font-size:12px;color:var(--muted);line-height:1.6;margin:7px 0 0">Roller cubs crack walls. Climbers hop over them. Screechers can hush a guard for one turn. Tunnel cubs skip the wall. Sleepy cubs can be woken up for a mighty, once-a-raid bonk.</p></div><div class="footnote">Nursery level ${s.build.nursery} · ${Math.max(0,6+s.build.nursery*2-Object.values(s.roster).reduce((a,b)=>a+b,0))} cozy training spots remain</div>`}
function collectionPage(){return `<div class="pagehead"><div><div class="eyebrow">A LITTLE BEAR BOOK</div><h1>Every cub has a story.</h1><div class="sub">Cub cards remember who they are and what makes them special.</div></div><button class="btn ghost" data-act="back-den">← Your den</button></div><div class="grid unitcards">${Object.entries(units).map(([k,u])=>`<article class="card unitcard"><div class="face">${u.emoji}</div><h3>${u.name}</h3><span class="pill">${s.collection.includes(k)?'MET IN MOSSWOOD':'NOT YET MET'}</span><p>${u.desc}</p><div class="speech"><b>“</b>${u.line}<b>”</b></div><div class="cost">${s.roster[k]||0} in your den</div></article>`).join('')}</div><div class="card" style="margin-top:18px;padding:16px"><h2 style="font-size:14px;margin:0 0 8px">Littermates look after one another</h2><p style="font-size:12px;line-height:1.6;color:var(--muted);margin:0">Raids are pretend storybook battles, but the cubs still feel fear, anger, pride and grief. If a cub falls, there is a quiet moment for their littermates. No blood or graphic scenes.</p></div>`}
function raidPage(){return `<div class="pagehead"><div><div class="eyebrow">SCOUTING MAP · MOSSWOOD VALLEY</div><h1>Who's ready for an adventure?</h1><div class="sub">Pick a few cubs, study the outpost, then choose your targets.</div></div><button class="btn ghost" data-act="back-den">← Your den</button></div><div class="grid raidlayout"><section class="card"><div class="cardhead"><h2>MAPLE-MOON OUTPOST</h2><small>SMALL FAMILY DEN · EASY SCOUT</small></div><div class="mapbg"><div class="enemy">${sitecard('guard','🛡️','Sleepy guard',24,true)}${sitecard('wall','🧱','Log wall',44,false)}${sitecard('honey','🍯','Honey pot',26,false)}${sitecard('berries','🫐','Berry basket',24,false)}${sitecard('store','🏠','Pantry',34,true)}${sitecard('toy','🧸','Toy chest',22,false)}</div></div></section><section class="card deploypanel"><h2>Scout the trail</h2><p>Your cubs decide how to reach the loot. Choose one, then tap a target.</p><div class="speech"><b>Scout Pip says:</b> “The wall's tall, but see that little tree by the pantry?”</div><div class="pick">${Object.entries(s.roster).filter(([,n])=>n>0).map(([k,n])=>`<button data-pick="${k}" class="${selectedUnit===k?'selected':''}"><span class="face">${units[k].emoji}</span><span>${units[k].name}<small>${n} ready · ${units[k].desc}</small></span></button>`).join('')||'<small>No cubs ready. Visit the nursery.</small>'}</div><p id="selecthint">${selectedUnit?'Now tap a building on the map.':'Pick a cub to begin.'}</p><button class="btn primary" data-act="deploy" ${selectedUnit&&selectedTarget?'':'disabled'}>SEND ${selectedUnit?units[selectedUnit].name.toUpperCase():'A CUB'}　→</button><button class="btn ghost" data-act="cancel-raid" style="margin-top:8px">Head back to den</button><div class="battlelog"><div class="label">FIELD NOTES</div>${raidLogHtml()}</div></section></div><div class="footnote">Choose your targets carefully. Cubs recover after the raid; lost cubs are remembered.</div>`;}
function sitecard(id,emo,title,hp,guard){let obj=raid.objects[id];return `<button class="target ${obj?.hp<=0?'destroyed':''} ${selectedTarget===id?'chosen':''}" data-target="${id}" ${obj?.hp<=0?'disabled':''}><span class="emoji">${emo}</span>${guard?'<span class="guard">🐾</span>':''}<b>${title}</b><small>${obj?.hp<=0?'CLEARED':`STAMINA ${obj?.hp??hp}/${hp}`}</small><span class="hp"><i style="width:${Math.max(0,(obj?.hp??hp)/hp*100)}%"></i></span></button>`}
function raidLogHtml(){return raid.notes?.length?raid.notes.slice(0,8).map(t=>`<div>${esc(t)}</div>`).join(''):'<div>The cubs crouch behind a fern. A little tail is still sticking out.</div>'}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>b.dataset.page==='raid'&&!raid?startRaid():setPage(b.dataset.page));document.querySelectorAll('[data-build]').forEach(b=>{if(b.dataset.cost)b.onclick=()=>upgrade(b.dataset.build,JSON.parse(b.dataset.cost));else b.onclick=()=>upgrade(b.dataset.build)});document.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>train(b.dataset.train));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selectedUnit=b.dataset.pick;selectedTarget=null;render()});document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{selectedTarget=b.dataset.target;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act))}
function upgrade(k,cost){if(k==='train'){setPage('train');return}if(!cost){let b=buildings[k];cost=Object.fromEntries(Object.entries(b.cost).map(([r,n])=>[r,Math.ceil(n*(s.build[k]+1))]))}if(!pay(cost)){toast('Not quite enough supplies. Try a raid or end the day for a basket.');return}s.build[k]++;if(k==='store')s.res.honey+=40;if(k==='berry')s.res.berries+=8;log(`${buildings[k].name} upgraded to level ${s.build[k]}. The den feels a little safer.`);render();toast(`${buildings[k].name} upgraded!`)}
function train(k){let u=units[k],total=Object.values(s.roster).reduce((a,b)=>a+b,0),cap=6+s.build.nursery*2;if(total>=cap){toast('The nursery is full. Upgrade it for more cozy cub spots.');return}if(!pay(u.cost)){toast('Not quite enough supplies for training.');return}s.roster[k]=(s.roster[k]||0)+1;if(!s.collection.includes(k))s.collection.push(k);log(`A new ${u.name} joined the den. “${u.line}”`);render();toast(`${u.name} joined the litter!`)}
function startRaid(){raid={objects:{wall:{hp:44},guard:{hp:24},honey:{hp:26},berries:{hp:24},store:{hp:34},toy:{hp:22}},notes:[],used:0,deployed:[],loot:{honey:0,berries:0,fish:0,toys:0,wood:0},fallen:0,lostUnit:null,stunned:0};selectedUnit=null;selectedTarget=null;setPage('raid');setTimeout(()=>toast('Pip found a tiny trail marker. Good luck, cubs!'),20)}
function act(a){if(a==='go-raid'){if(!raid)startRaid();else setPage('raid')}if(a==='go-train')setPage('train');if(a==='back-den')setPage('den');if(a==='deploy')deploy();if(a==='cancel-raid'){raid=null;setPage('den')}if(a==='end-day')endDay()}
function deploy(){if(!raid||!selectedUnit||!selectedTarget)return;let k=selectedUnit,u=units[k],o=raid.objects[selectedTarget];if(!o||o.hp<=0)return;if((s.roster[k]||0)<=0)return;s.roster[k]--;raid.deployed.push(k);raid.used++;let target=selectedTarget;let bonus=0,extra='',guard=raid.objects.guard.hp>0&&['wall','honey','berries','store','toy'].includes(target);if(k==='roller'&&target==='wall'){bonus=19;extra=' Roller cub crashes into the wall!'}if(k==='climber'&&target!=='wall'&&raid.objects.wall.hp>0){extra=' Climber cub climbs over the wall and slips past the guard!'}if(k==='tunnel'&&target==='wall'){bonus=20;extra=' Tunnel cub burrows under the wall!'}if(k==='tunnel'&&['store','honey','toy'].includes(target)){bonus=11;extra=' Tunnel cub emerges beneath the structure!'}if(k==='screecher'&&raid.objects.guard.hp>0){raid.stunned=1;extra=' The guard is stunned by a mighty screech!'}if(k==='sleepy'){bonus=raid.used===1?0:21;extra=bonus?' A littermate wakes the sleepy cub at just the right moment!':' The sleepy cub dozes off halfway there. Wake them on the next turn!'}let dmg=u.damage+bonus;o.hp=Math.max(0,o.hp-dmg);let note=`${u.emoji} ${u.name}: “${u.line}”${extra} ${targetName(target)} loses ${dmg} stamina.`;raid.notes.unshift(note);if(o.hp<=0){let resource={honey:'honey',berries:'berries',toy:'toys'}[target];if(resource){let n=target==='honey'?28:target==='berries'?23:16;raid.loot[resource]+=n;raid.notes.unshift(`The cubs found ${n} ${resource}! Into the pack it goes.`)}else raid.notes.unshift(`${targetName(target)} is cleared!`)}if(raid.stunned){raid.stunned=0;raid.notes.unshift('The outpost guard blinks and forgets what they were doing.');}else if(guard&&o.hp>0&&!(k==='climber'&&target!=='wall'&&raid.objects.wall.hp>0)){let hit=10+(s.raidCount%2)*2;raid.notes.unshift(`The guard swats at the team for ${hit} stamina. The cubs scatter behind a stump.`);if(raid.used>=3&&raid.fallen===0){raid.fallen=1;raid.lostUnit=k;raid.notes.unshift('A sudden silence. One cub does not get back up. “No… that was my little sister,” Pip whispers. The litter huddles together, shaking.');}else raid.notes.unshift('One cub is shaken but makes it behind a stump.');}
if(Object.values(raid.objects).filter(x=>x.hp<=0).length>=3||raid.used>=5||Object.keys(s.roster).every(x=>s.roster[x]<=0)){finishCheck()}else{selectedUnit=null;selectedTarget=null;render()}}
function targetName(t){return({wall:'the log wall',guard:'the lookout post',honey:'the honey pot',berries:'the berry basket',store:'the pantry',toy:'the toy chest'})[t]}
function finishCheck(){let cleared=Object.values(raid.objects).filter(o=>o.hp<=0).length,success=cleared>=2;if(success){for(let k in raid.loot)s.res[k]+=raid.loot[k];s.res.wood+=18;s.res.fish+=10;s.wins++;s.lastRaid=true;log(`The cubs raided Maple-Moon and came home with ${raid.loot.honey} honey, ${raid.loot.berries} berries, ${raid.loot.toys} toys, plus timber and fish.`)}else{let protectedPct=Math.min(85,s.build.wall*14+s.build.store*18);let kept=Math.floor(raid.loot.honey*protectedPct/100);s.res.honey+=kept;s.res.berries+=Math.floor(raid.loot.berries*protectedPct/100);s.lastRaid=true;log(`The cubs came home early with ${kept} honey safe in the pack. The upgraded pantry kept most supplies tucked away.`)}for(let key of raid.deployed){if(key!==raid.lostUnit)s.roster[key]=(s.roster[key]||0)+1;else s.casualties++;}s.raidCount++;s.day++;save();let fallen=raid.fallen;let msg=fallen?`Pip holds a little leaf beside the fern where their littermate fell. “I’m scared. I’m mad. I miss her.” The story remembers the loss; there is no graphic scene.`:success?`The cubs tumble home, tired but together. “We did it! I was scared, but I wasn't by myself!”`: `The guard surprised the team. Everyone made it home with what they could carry.`;document.querySelector('#modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="hero">${fallen?'🍂':success?'🎒':'🌙'}</div><div class="eyebrow">RAID ${success?'COMPLETE':'OVER'}</div><h2>${fallen?'A quiet moment':success?'The cubs made it home!':'A brave try, little ones.'}</h2><p>${esc(msg)}</p><div class="speech">${raid.notes.slice(0,3).map(t=>`<div>${esc(t)}</div>`).join("")}</div><p><b>Pack:</b> 🍯 ${raid.loot.honey}　🫐 ${raid.loot.berries}　🧸 ${raid.loot.toys}</p><button class="btn primary" data-dismiss>Back to your den</button></div></div>`;document.querySelector('[data-dismiss]').onclick=()=>{document.querySelector('#modalroot').innerHTML='';raid=null;setPage('den')}}
function endDay(){let loss=Math.max(0,22-s.build.wall*5-s.build.store*6);if(s.build.wall+s.build.store>1){s.res.honey=Math.max(0,s.res.honey-loss);s.res.berries+=12+s.build.berry*8;log(`Night patrol: pantry defenses kept the den safe. Lost ${loss} honey; the berry patch yielded ${12+s.build.berry*8}.`);toast(`Night patrol returned. +${12+s.build.berry*8} berries.`)}else{let stolen=Math.min(s.res.honey,18);s.res.honey-=stolen;s.res.berries+=12;log(`A sneaky night visit took ${stolen} honey. The den saved ${s.res.honey} behind the pantry wall.`);toast(`A night visitor took ${stolen} honey. Build a pantry or wall to protect more.`)}s.day++;save();render()}
function welcome(){document.querySelector('#modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="hero">🐻</div><div class="eyebrow">MOSSWOOD VALLEY · DAY ONE</div><h2>Welcome home, little scout.</h2><p>Your bear family has a cozy den and a curious litter. Build up your pantry, meet each cub, then visit Maple-Moon Outpost for a storybook raid. The cubs talk, feel things deeply, and look after one another.</p><p><b>How to play:</b> Tap a building to upgrade it. Train cubs at the nursery. During raids, pick a cub, choose a target, then send them in. Progress saves in this browser.</p><button class="btn primary" data-dismiss>Let's explore Mosswood</button></div></div>`;document.querySelector('[data-dismiss]').onclick=()=>document.querySelector('#modalroot').innerHTML=''}
render();
})();
</script></body></html>
