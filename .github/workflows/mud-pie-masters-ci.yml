name: Mud Pie Masters (Windows + Linux)
on:
  pull_request:
    paths:
      - 'games/mud-pie-masters/**'
      - '.github/workflows/mud-pie-masters-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/mud-pie-masters/**'
      - '.github/workflows/mud-pie-masters-ci.yml'
permissions:
  contents: read
jobs:
  test:
    name: Py3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: games/mud-pie-masters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require full source import
        shell: bash
        run: |
          test -f main.py || { echo 'Mud Pie Masters source not imported yet'; exit 1; }
          test -d assets && test -d tests && test -d mudpie
      - name: Install
        id: install
        run: python -m pip install -r requirements-dev.txt
      - name: Logic and headless Pygame tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q
      - name: Campaign simulation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/simulate_campaign.py
      - name: SDL event-driven gameplay walkthrough and screenshots
        if: ${{ always() && steps.install.outcome == 'success' }}  # Diagnose test failures after a successful install.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/runtime_walkthrough.py --output qa-artifacts/runtime
      - name: Upload rendered runtime screenshots and input trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mudpie-runtime-${{ matrix.os }}
          path: games/mud-pie-masters/qa-artifacts/runtime/
          if-no-files-found: warn
          retention-days: 14
      - name: Complete all 48 contests in actual Pygame runtime
        if: ${{ always() && steps.install.outcome == 'success' }}  # Diagnose test failures after a successful install.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/full_campaign_runtime.py --output qa-artifacts/full-campaign
      - name: Upload full campaign screenshots and audit JSON
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mudpie-full-campaign-${{ matrix.os }}
          path: games/mud-pie-masters/qa-artifacts/full-campaign/
          if-no-files-found: error
          retention-days: 30
